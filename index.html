
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STM Games</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #10131f;
      color: white;
      text-align: center;
    }
    header {
      padding: 24px;
      background: #1c2235;
    }
    h1 {
      color: #7cdbff;
      font-size: 36px;
    }
    main {
      padding: 45px 20px;
    }
    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #202941;
      border-radius: 18px;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #56c9f5;
      color: #10131f;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    footer {
      padding: 20px;
      color: #aab3c8;
    }
  </style>
</head>
<body>
  <header>
    <h1>STM Games</h1>
    <p>دنیای بازی‌های ساخته‌شده توسط STM</p>
  </header>

  <main>
    <div class="card">
      <h2>به سایت ما خوش آمدید! 🎮</h2>
      <p>اینجا قراره بازی‌های خودمون رو معرفی کنیم.</p>
      <p>به‌زودی بازی‌های جدید منتشر می‌شن!</p>
    </div>
  </main>

  <footer>
    © STM Games
  </footer>
</body>
</html>
